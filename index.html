<body class="home">

  <!-- =====================
       HEADER + NAVIGAZIONE
       Il menu compare in alto su desktop.
       Su mobile si apre cliccando il pulsante hamburger (le 3 righe).
       Per aggiungere una voce al menu: copia un <a> e cambia href e testo.
       ===================== -->
  <header id="page-header" class="header header--overlay">

    <!-- Pulsante hamburger — visibile solo su mobile -->
    <button class="hamburger" id="hamburger" aria-label="Apri menu" aria-controls="primary-nav" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <!-- Voci del menu principale -->
    <nav class="nav" id="primary-nav" aria-label="Navigazione principale">

      <a href="trasparenza.html">TRASPARENZA</a>
    </nav>
  </header>

  <!-- =====================
       HERO — schermata iniziale
       L'immagine di sfondo si trova in: assets/hero.webp
       Per cambiarla: sostituire il file assets/hero.webp con la nuova immagine
       (stesso nome, formato .webp).
       Il logo al centro si trova in: logo-esteso.webp (radice del progetto)
       ===================== -->
  <section class="hero">
    <div class="hero-inner">
      <img class="logo-extended" src="logo-esteso.webp" alt="Logo esteso">
    </div>
  </section>

  <!-- Script principale: gestisce menu mobile e altezza viewport -->
  <script src="assets/site.js"></script>
